version: '3.8'

services:
  app:
    image: sbrv1-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn --workers 1 --threads 1 --timeout 300 -b 0.0.0.0:7860 app:app
    environment:
      - PORT=7860
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:7860
    restart: unless-stopped
    depends_on:
      - app
