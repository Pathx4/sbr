services:
  app:
    image: sbrv1-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn --workers 1 --threads 1 --timeout 300 -b 0.0.0.0:7860 app:app
    environment:
      - PORT=7860
      - SBR_PASSCODE=gistda2026
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
    volumes:
      - paddlex_cache:/root/.paddlex
      - paddleocr_cache:/root/.paddleocr
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:7860
    restart: unless-stopped
    depends_on:
      - app

volumes:
  paddlex_cache:
  paddleocr_cache:
