version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # ไม่ต้องเปิดพอร์ตสู่ Host (Zero Inbound Port) เพื่อไม่ให้ชนกับ Container อื่นบน Server
    # ports:
    #   - "7860:7860"
    environment:
      - PORT=7860
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:7860
    restart: unless-stopped
