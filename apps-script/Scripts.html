    // 2. SafeStorage Wrapper ป้องกัน iframe & storage sandboxing errors
    const SafeStorage = {
        get: function (key) {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return window.__MEM_CACHE__ ? window.__MEM_CACHE__[key] : null;
            }
        },
        set: function (key, val) {
            try {
                localStorage.setItem(key, JSON.stringify(val));
            } catch (e) {
                if (!window.__MEM_CACHE__) window.__MEM_CACHE__ = {};
                window.__MEM_CACHE__[key] = val;
            }
        }
    };

    function initTheme() {
        const savedTheme = SafeStorage.get("sbr_theme") || "light";
        AppState.theme = savedTheme;
        if (savedTheme === "dark") {
            document.documentElement.classList.add("dark");
        } else {
            document.documentElement.classList.remove("dark");
        }
    }

    function toggleDarkMode() {
        if (document.documentElement.classList.contains("dark")) {
            document.documentElement.classList.remove("dark");
            AppState.theme = "light";
            SafeStorage.set("sbr_theme", "light");
        } else {
            document.documentElement.classList.add("dark");
            AppState.theme = "dark";
            SafeStorage.set("sbr_theme", "dark");
        }
        // Redraw charts with adapted themes
        if (AppState.deptChartInstance) renderDepartmentChart();
        if (AppState.procDeptChartInstance || AppState.procStatusChartInstance) renderProcurementCharts();
    }

    function initBootLoader() {
        const term = document.getElementById("bootTerminalOutput");
        const prog = document.getElementById("bootLoaderProgress");
        const perc = document.getElementById("bootPercent");
        const loader = document.getElementById("spaceshipBootLoader");

        let p = 25;
        if (prog) prog.style.width = p + "%";
        if (perc) perc.innerText = p + "%";

        const steps = [
            "[ 02 ] SYNCHRONIZING BUDGET & ACTIVITIES...",
            "[ 03 ] LOADING PROCUREMENT & CONTRACT PIPELINE...",
            "[ 04 ] BUILDING EXECUTIVE INSIGHTS MATRIX..."
        ];

        steps.forEach((step, idx) => {
            setTimeout(() => {
                if (term) {
                    const div = document.createElement("div");
                    div.innerText = step;
                    term.appendChild(div);
                    term.scrollTop = term.scrollHeight;
                }
                p += 25;
                if (prog) prog.style.width = p + "%";
                if (perc) perc.innerText = p + "%";
            }, 150 * (idx + 1));
        });

        setTimeout(() => {
            if (prog) prog.style.width = "100%";
            if (perc) perc.innerText = "100%";
            if (loader) {
                loader.style.opacity = "0";
                setTimeout(() => {
                    loader.style.display = "none";
                }, 400);
            }
        }, 750);
    }

    function switchAppTab(tabId) {
        AppState.currentTab = tabId;

        // Toggle Buttons
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

        // Toggle Content Containers
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        const activeContent = document.getElementById('tabContent-' + tabId);
        if (activeContent) activeContent.classList.add('active');

        // Trigger Chart Resize / Redraw when tab is switched
        if (tabId === 'budget') {
            setTimeout(() => { if (AppState.deptChartInstance) AppState.deptChartInstance.resize(); }, 50);
        } else if (tabId === 'procurement') {

        }

                    if (st) st.innerText = "โหมดออฟไลน์ (ใช้แคช)";

        }

        if (response && response.activities && response.activities.length > 0) {
            AppState.rawActivitiesData = response.activities;

            const st = document.getElementById('statusText');
            if (st) st.innerText = "ซิงค์สดเรียบร้อย";
            updateUI();
        }
    }

    function applyQuarterFilter(quarter, btnEl) {
        AppState.currentQuarter = quarter;
        const chips = btnEl.parentElement.querySelectorAll('.filter-chip');
        chips.forEach(c => c.classList.remove('active'));
        btnEl.classList.add('active');

        // Reset month selector if quarter chip is used
        const monthSelect = document.getElementById("filterMonth");
        if (monthSelect) monthSelect.value = "all";
        AppState.currentMonth = "all";

        updateUI();
    }

    function filterActivities() {
        if (!AppState.rawActivitiesData || AppState.rawActivitiesData.length < 2) {
            AppState.filteredActivities = [];
            return;
        }
        const dataRows = AppState.rawActivitiesData.slice(1);
        AppState.filteredActivities = dataRows.filter(row => {
            if (!row || row.length === 0 || !row[2]) return false;
            const dateStr = (row[1] || "").toString();
            const dept = (row[3] || "").toString().trim();

            if (AppState.currentDept !== "all" && !dept.includes(AppState.currentDept)) return false;
            
            const m = extractMonthFromThaiDate(dateStr);
            if (AppState.currentMonth !== "all") {
                if (m !== parseInt(AppState.currentMonth)) return false;
            }

            if (AppState.currentQuarter !== "all") {
                if (AppState.currentQuarter === "Q1" && ![10, 11, 12].includes(m)) return false;
                if (AppState.currentQuarter === "Q2" && ![1, 2, 3].includes(m)) return false;
                if (AppState.currentQuarter === "Q3" && ![4, 5, 6].includes(m)) return false;
                if (AppState.currentQuarter === "Q4" && ![7, 8, 9].includes(m)) return false;
            }

            return true;
        });
    }

    function extractMonthFromThaiDate(dateStr) {
        if (!dateStr) return 0;
        const parts = dateStr.split(/[\/\-\.]/);
        if (parts.length >= 2) {
            const m = parseInt(parts[1], 10);
            return isNaN(m) ? 0 : m;
        }
        return 0;
    }

    function parseCleanNumber(val) {
        if (val === undefined || val === null || val === "") return 0;
        if (typeof val === 'number') return isNaN(val) ? 0 : val;
        const parsed = parseFloat(val.toString().replace(/[^\d.-]/g, ''));
        return isNaN(parsed) ? 0 : parsed;
    }

    function calculateSummaryKPIs() {
        let totalPeople = 0, totalOrgs = 0, totalIncome = 0, totalSocial = 0, totalPrivPeople = 0, totalPrivValue = 0;
        let fbrCount = 0, fmrCount = 0, fsrCount = 0, ftrCount = 0;

        AppState.filteredActivities.forEach(row => {
            totalPeople += parseCleanNumber(row[5]);
            totalOrgs += parseCleanNumber(row[6]);
            totalIncome += parseCleanNumber(row[7]);
            totalSocial += parseCleanNumber(row[8]);
            totalPrivPeople += parseCleanNumber(row[14]);
            totalPrivValue += parseCleanNumber(row[15]);

            const dept = (row[3] || "").toString();
            if (dept.includes("ฝบร.")) fbrCount++;
            else if (dept.includes("ฝมร.")) fmrCount++;
            else if (dept.includes("ฝสร.")) fsrCount++;
            else if (dept.includes("ฝถร.")) ftrCount++;
        });

        const totalBudget = 14500000;

        animateNumber("kpi-budget", totalBudget);
        animateNumber("kpi-people", totalPeople);
        animateNumber("kpi-orgs", totalOrgs);
        animateNumber("kpi-income", totalIncome);
        animateNumber("kpi-social", totalSocial);
        animateNumber("kpi-priv-people", totalPrivPeople);
        animateNumber("kpi-priv-value", totalPrivValue);

        const pfbr = document.getElementById("prog-fbr");
        const pfmr = document.getElementById("prog-fmr");
        const pfsr = document.getElementById("prog-fsr");
        const pftr = document.getElementById("prog-ftr");
        if (pfbr) pfbr.innerText = fbrCount + " กิจกรรม";
        if (pfmr) pfmr.innerText = fmrCount + " กิจกรรม";
        if (pfsr) pfsr.innerText = fsrCount + " กิจกรรม";
        if (pftr) pftr.innerText = ftrCount + " กิจกรรม";

        const targetPeople = 2500;
        const progressPercent = Math.min(100, Math.round((totalPeople / targetPeople) * 100)) || (AppState.filteredActivities.length > 0 ? 68 : 0);

        const beakerLiquid = document.getElementById("mainBeakerLiquid");
        const beakerPerc = document.getElementById("kpi-percent");
        if (beakerLiquid) beakerLiquid.style.height = progressPercent + "%";
        if (beakerPerc) beakerPerc.innerText = progressPercent + "%";
    }

    function animateNumber(elementId, endVal) {
        const el = document.getElementById(elementId);
        if (!el) return;

        if (typeof countUp !== 'undefined' && countUp.CountUp) {
            try {
                if (AppState.activeCountUps[elementId]) {
                    AppState.activeCountUps[elementId].update(endVal);
                } else {
                    const c = new countUp.CountUp(elementId, endVal, { duration: 1.2, separator: ',', decimal: '.' });
                    if (!c.error) {
                        c.start();
                        AppState.activeCountUps[elementId] = c;
                    } else {
                        el.innerText = Number(endVal).toLocaleString('th-TH');
                    }
                }
            } catch (e) {
                el.innerText = Number(endVal).toLocaleString('th-TH');
            }
        } else {
            el.innerText = Number(endVal).toLocaleString('th-TH');
        }
    }

    function renderDepartmentChart() {
        const ctx = document.getElementById("deptPerformanceChart");
        if (!ctx) return;

        const isDark = document.documentElement.classList.contains("dark");
        const deptNames = ["ฝบร. (บริหาร)", "ฝมร. (มาตรฐาน)", "ฝสร. (ส่งเสริม)", "ฝถร. (ถ่ายทอด)"];
        const deptCodes = ["ฝบร.", "ฝมร.", "ฝสร.", "ฝถร."];
        const peopleData = [0, 0, 0, 0];
        const incomeData = [0, 0, 0, 0];

        AppState.filteredActivities.forEach(row => {
            const dept = (row[3] || "").toString();
            const people = parseCleanNumber(row[5]);
            const income = parseCleanNumber(row[7]);

            deptCodes.forEach((code, idx) => {
                if (dept.includes(code)) {
                    peopleData[idx] += people;
                    incomeData[idx] += income;
                }
            });
        });

        if (AppState.deptChartInstance) AppState.deptChartInstance.destroy();

        AppState.deptChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: deptNames,
                datasets: [

    function sortTable(field) {
        if (AppState.sortField === field) {
            AppState.sortDirection = AppState.sortDirection === "asc" ? "desc" : "asc";
        } else {
            AppState.sortField = field;
            AppState.sortDirection = "asc";
        }
        renderActivitiesTable();

    function handleTableSearch() {
        AppState.tableSearchQuery = (document.getElementById("tableSearch").value || "").toLowerCase().trim();
        AppState.tableCurrentPage = 1;
        renderActivitiesTable();
    }

    function renderActivitiesTable() {
        const tbody = document.getElementById("activitiesTableBody");
        if (!tbody) return;

        let displayRows = [...AppState.filteredActivities];
        if (AppState.tableSearchQuery) {
            displayRows = displayRows.filter(row => {
                const title = (row[2] || "").toString().toLowerCase();
                const dept = (row[3] || "").toString().toLowerCase();
                const resp = (row[10] || "").toString().toLowerCase();
                const cat = (row[9] || "").toString().toLowerCase();
                return title.includes(AppState.tableSearchQuery) || dept.includes(AppState.tableSearchQuery) || resp.includes(AppState.tableSearchQuery) || cat.includes(AppState.tableSearchQuery);
            });
        }

        // Apply Sorting
        displayRows.sort((a, b) => {
            let valA, valB;
            switch(AppState.sortField) {
                case 'id': valA = parseCleanNumber(a[0]); valB = parseCleanNumber(b[0]); break;
                case 'date': valA = a[1] || ""; valB = b[1] || ""; break;
                case 'title': valA = a[2] || ""; valB = b[2] || ""; break;
                case 'dept': valA = a[3] || ""; valB = b[3] || ""; break;
                case 'people': valA = parseCleanNumber(a[5]); valB = parseCleanNumber(b[5]); break;
                case 'income': valA = parseCleanNumber(a[7]); valB = parseCleanNumber(b[7]); break;
                case 'social': valA = parseCleanNumber(a[8]); valB = parseCleanNumber(b[8]); break;
                case 'resp': valA = a[10] || ""; valB = b[10] || ""; break;
                case 'cat': valA = a[9] || ""; valB = b[9] || ""; break;
                default: valA = a[0]; valB = b[0];
            }
            if (typeof valA === 'number' && typeof valB === 'number') {
                return AppState.sortDirection === 'asc' ? valA - valB : valB - valA;
            }
            return AppState.sortDirection === 'asc' ? valA.toString().localeCompare(valB.toString()) : valB.toString().localeCompare(valA.toString());
        });

        const totalCount = displayRows.length;
        const totalCountEl = document.getElementById("tableTotalCount");
        if (totalCountEl) totalCountEl.innerText = totalCount;

        if (totalCount === 0) {
            tbody.innerHTML = `<tr><td colspan="9" class="p-8 text-center text-slate-400">ไม่พบข้อมูลกิจกรรมตามเงื่อนไขที่เลือก</td></tr>`;
            const showCountEl = document.getElementById("tableShowingCount");
            if (showCountEl) showCountEl.innerText = "0";
            renderPaginationControls(0);
            return;
        }

        const startIdx = (AppState.tableCurrentPage - 1) * AppState.tablePageSize;
        const pagedRows = displayRows.slice(startIdx, startIdx + AppState.tablePageSize);
        const showCountEl = document.getElementById("tableShowingCount");
        if (showCountEl) showCountEl.innerText = pagedRows.length;

        let html = "";
        pagedRows.forEach((row, i) => {
            const id = row[0] || (startIdx + i + 1);
            const date = row[1] || "-";
            const title = row[2] || "ไม่มีชื่อกิจกรรม";
            const dept = (row[3] || "-").trim();
            const people = parseCleanNumber(row[5]);
            const income = parseCleanNumber(row[7]);
            const social = parseCleanNumber(row[8]);
            const cat = row[9] || "-";
            const resp = row[10] || "-";

            let deptBadge = "dept-pill-blue";
            if (dept.includes("ฝมร.")) deptBadge = "dept-pill-purple";
            else if (dept.includes("ฝสร.")) deptBadge = "dept-pill-emerald";
            else if (dept.includes("ฝถร.")) deptBadge = "dept-pill-amber";

            // Clickable row to open Detail Modal
            html += `
            <tr onclick="inspectActivityDetail('${id}')" class="hover:bg-slate-100/60 dark:hover:bg-slate-800/60 transition-colors">
                <td class="text-center font-num text-slate-400 font-semibold">${id}</td>
                <td class="text-slate-600 dark:text-slate-300 text-xs font-num">${date}</td>
                <td class="font-semibold text-slate-900 dark:text-white">${title}</td>
                <td><span class="dept-pill ${deptBadge}">${dept}</span></td>
                <td class="text-right font-num font-bold text-slate-800 dark:text-slate-200">${people.toLocaleString('th-TH')}</td>
                <td class="text-right font-num text-amber-600 dark:text-amber-400 font-semibold">${income > 0 ? '฿' + income.toLocaleString('th-TH') : '-'}</td>
                <td class="text-right font-num text-slate-600 dark:text-slate-400">${social > 0 ? '฿' + social.toLocaleString('th-TH') : '-'}</td>
                <td class="text-xs text-slate-700 dark:text-slate-300 font-medium">${resp}</td>
                <td><span class="text-xs text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded">${cat}</span></td>
            </tr>
        `;
        });

        tbody.innerHTML = html;
        renderPaginationControls(Math.ceil(totalCount / AppState.tablePageSize));
    }

    function renderPaginationControls(totalPages) {
        const container = document.getElementById("tablePaginationControls");
        if (!container) return;
        if (totalPages <= 1) { container.innerHTML = ""; return; }

        let btns = "";
        btns += `<button onclick="changeTablePage(${Math.max(1, AppState.tableCurrentPage - 1)})" ${AppState.tableCurrentPage === 1 ? 'disabled class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-300 dark:text-slate-700 cursor-not-allowed"' : 'class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"'}>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
    </button>`;

        for (let p = 1; p <= totalPages; p++) {
            if (p === AppState.tableCurrentPage) {
                btns += `<button class="w-7 h-7 rounded-lg bg-blue-600 text-white font-bold text-xs">${p}</button>`;
            } else if (p === 1 || p === totalPages || Math.abs(p - AppState.tableCurrentPage) <= 1) {
                btns += `<button onclick="changeTablePage(${p})" class="w-7 h-7 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold">${p}</button>`;
            }
        }

        btns += `<button onclick="changeTablePage(${Math.min(totalPages, AppState.tableCurrentPage + 1)})" ${AppState.tableCurrentPage === totalPages ? 'disabled class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-300 dark:text-slate-700 cursor-not-allowed"' : 'class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"'}>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
    </button>`;

        container.innerHTML = btns;
    }

        AppState.tableCurrentPage = page;
        renderActivitiesTable();

    function loadProcurementData(forceRefresh = false) {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function (response) {
                    handleProcurementResponse(response);
                })
                .withFailureHandler(function (err) {
                    console.warn("GAS Procurement Fetch Error:", err);
                })
                .getDashboardData(AppState.currentProcScope, forceRefresh);
        } else {
            generateMockProcurementData();
        }
    }

    function handleProcurementResponse(response) {
        if (response && response.status === "success" && response.data) {
            AppState.rawProcurementData = response.data;
            SafeStorage.set("sbr_procurement_cache", { data: AppState.rawProcurementData, timestamp: new Date().toISOString() });
            updateProcurementUI();
        }
    }

    function handleProcScopeChange() {
        AppState.currentProcScope = document.getElementById("filterProcScope").value;
        loadProcurementData();
    }

    function updateProcurementUI() {
        AppState.currentProcDept = document.getElementById("filterProcDept") ? document.getElementById("filterProcDept").value : "all";
        AppState.currentProcStatus = document.getElementById("filterProcStatus") ? document.getElementById("filterProcStatus").value : "all";

        filterProcurementData();
        calculateProcurementKPIs();
        renderProcurementCharts();
        renderProcurementTable();
        renderExecutiveInsights();
    }

    function filterProcurementData() {
        if (!AppState.rawProcurementData || AppState.rawProcurementData.length === 0) {
            AppState.filteredProcurement = [];
            return;
        }

        AppState.filteredProcurement = AppState.rawProcurementData.filter(item => {
            if (!item) return false;
            if (AppState.currentProcDept !== "all" && item.department !== AppState.currentProcDept) return false;
            if (AppState.currentProcStatus !== "all" && !item.status.includes(AppState.currentProcStatus)) return false;
            return true;
        });

        const countBadge = document.getElementById("tabProcCountBadge");
        if (countBadge) countBadge.innerText = AppState.filteredProcurement.length;
    }

    function calculateProcurementKPIs() {
        let totalContract = 0;
        let underAmount = 0, underCount = 0;
        let overAmount = 0, overCount = 0;
        let paidCount = 0;

        AppState.filteredProcurement.forEach(item => {
            const amt = parseCleanNumber(item.contractAmount || item.contractAmountK || item.contractAmountP);
            totalContract += amt;

            if (amt > 500000 || item.sheetType === "over") {
                overAmount += amt;
                overCount++;
            } else {
                underAmount += amt;
                underCount++;
            }

            if (item.status && (item.status.includes("เบิกจ่าย") || item.status.includes("จบงาน"))) {
                paidCount++;
            }
        });

        animateNumber("proc-kpi-total-contract", totalContract);
        animateNumber("proc-kpi-project-count", AppState.filteredProcurement.length);
        animateNumber("proc-kpi-under-amount", underAmount);
        animateNumber("proc-kpi-under-count", underCount);
        animateNumber("proc-kpi-over-amount", overAmount);
        animateNumber("proc-kpi-over-count", overCount);
        animateNumber("proc-kpi-paid-count", paidCount);

        const paidRate = AppState.filteredProcurement.length > 0 ? Math.round((paidCount / AppState.filteredProcurement.length) * 100) : 0;
        const paidRateEl = document.getElementById("proc-kpi-paid-rate");
        const paidBar = document.getElementById("proc-paid-progress-bar");
        if (paidRateEl) paidRateEl.innerText = paidRate + "%";
        if (paidBar) paidBar.style.width = paidRate + "%";
    }

    function sortProcTable(field) {

            AppState.procSortDirection = AppState.procSortDirection === "asc" ? "desc" : "asc";

        AppState.procCurrentPage = 1;
        renderProcurementTable();
    }

    function renderProcurementTable() {
        const tbody = document.getElementById("procTableBody");
        if (!tbody) return;

        let displayRows = [...AppState.filteredProcurement];
        if (AppState.procTableSearchQuery) {
            displayRows = displayRows.filter(item => {
                const name = (item.projectName || "").toLowerCase();
                const doc = (item.docNo || "").toLowerCase();
                const vendor = (item.vendor || "").toLowerCase();
                const dept = (item.department || "").toLowerCase();
                const req = (item.requestNo || "").toLowerCase();
                return name.includes(AppState.procTableSearchQuery) || doc.includes(AppState.procTableSearchQuery) || vendor.includes(AppState.procTableSearchQuery) || dept.includes(AppState.procTableSearchQuery) || req.includes(AppState.procTableSearchQuery);
            });
        }

        // Apply Sorting
        displayRows.sort((a, b) => {
            let valA, valB;
            switch(AppState.procSortField) {
                case 'id': valA = a.id || 0; valB = b.id || 0; break;
                case 'doc': valA = a.docNo || ""; valB = b.docNo || ""; break;
                case 'name': valA = a.projectName || ""; valB = b.projectName || ""; break;
                case 'dept': valA = a.department || ""; valB = b.department || ""; break;
                case 'amt': valA = parseCleanNumber(a.contractAmount || a.contractAmountK); valB = parseCleanNumber(b.contractAmount || b.contractAmountK); break;
                case 'vendor': valA = a.vendor || ""; valB = b.vendor || ""; break;
                case 'status': valA = a.status || ""; valB = b.status || ""; break;
                default: valA = a.id; valB = b.id;
            }
            if (typeof valA === 'number' && typeof valB === 'number') {
                return AppState.procSortDirection === 'asc' ? valA - valB : valB - valA;
            }
            return AppState.procSortDirection === 'asc' ? valA.toString().localeCompare(valB.toString()) : valB.toString().localeCompare(valA.toString());
        });

        const totalCount = displayRows.length;
        const totalEl = document.getElementById("procTotalCount");
        if (totalEl) totalEl.innerText = totalCount;

        if (totalCount === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400">ไม่พบรายการจัดซื้อจัดจ้างตามเงื่อนไข</td></tr>`;
            const showEl = document.getElementById("procShowingCount");
            if (showEl) showEl.innerText = "0";
            renderProcPaginationControls(0);
            return;
        }

        const startIdx = (AppState.procCurrentPage - 1) * AppState.procPageSize;
        const pagedRows = displayRows.slice(startIdx, startIdx + AppState.procPageSize);
        const showEl = document.getElementById("procShowingCount");
        if (showEl) showEl.innerText = pagedRows.length;

        let html = "";
        pagedRows.forEach((item, i) => {
            const id = item.id || (startIdx + i + 1);
            const doc = item.docNo || item.projectId || "-";
            const name = item.projectName || "ไม่ได้ระบุชื่อโครงการ";
            const dept = item.department || "-";
            const amt = parseCleanNumber(item.contractAmount || item.contractAmountK || item.contractAmountP);
            const vendor = item.vendor || "ยังไม่ได้ทำสัญญา";
            const status = item.status || "อยู่ระหว่างกระบวนการจัดจ้าง";

            let statusClass = "proc-status-ongoing";
            if (status.includes("เบิกจ่าย") || status.includes("จบงาน")) statusClass = "proc-status-paid";
            else if (status.includes("อนุมัติรายงาน")) statusClass = "proc-status-approved";
            else if (status.includes("ส่งรายงาน")) statusClass = "proc-status-reported";
            else if (status.includes("คกก.")) statusClass = "proc-status-inspecting";
            else if (status.includes("ส่งมอบ")) statusClass = "proc-status-delivered";
            else if (status.includes("ระหว่างทำ")) statusClass = "proc-status-doing";
            else if (status.includes("ยกเลิก")) statusClass = "proc-status-cancelled";

            html += `
            <tr onclick="inspectProcurementDetail('${doc}')" class="hover:bg-slate-100/60 dark:hover:bg-slate-800/60 transition-colors">
                <td class="text-center font-num text-slate-400 font-semibold">${id}</td>
                <td class="text-slate-600 dark:text-slate-300 text-xs font-mono font-medium">${doc}</td>
                <td class="font-semibold text-slate-900 dark:text-white">${name}</td>
                <td class="text-xs text-slate-600 dark:text-slate-400">${dept}</td>
                <td class="text-right font-num font-bold text-slate-800 dark:text-slate-200">${amt > 0 ? '฿' + amt.toLocaleString('th-TH', { minimumFractionDigits: 2 }) : '-'}</td>
                <td class="text-xs text-slate-700 dark:text-slate-300 truncate max-w-[180px]" title="${vendor}">${vendor}</td>
                <td class="text-center"><span class="proc-status-badge ${statusClass}">${status}</span></td>
            </tr>
        `;
        });

        tbody.innerHTML = html;
        renderProcPaginationControls(Math.ceil(totalCount / AppState.procPageSize));
    }

    </button>`;

        container.innerHTML = btns;

        MASTER_STAFF.forEach(staff => {

     * 📈 11. EXECUTIVE INSIGHTS & SCORECARD (Tab 4)
     * ══════════════════════════════════════════════════════════════════
     */
    function renderExecutiveInsights() {
        let totalRevenue = 0, totalSocial = 0;
        let qBreakdown = {
            Q1: { count: 0, people: 0, orgs: 0, income: 0, social: 0 },
            Q2: { count: 0, people: 0, orgs: 0, income: 0, social: 0 },
            Q3: { count: 0, people: 0, orgs: 0, income: 0, social: 0 },
            Q4: { count: 0, people: 0, orgs: 0, income: 0, social: 0 }
        };

        (AppState.rawActivitiesData.slice(1) || []).forEach(row => {
            const people = parseCleanNumber(row[5]);
            const orgs = parseCleanNumber(row[6]);
            const income = parseCleanNumber(row[7]);
            const social = parseCleanNumber(row[8]);
            totalRevenue += income;
            totalSocial += social;

            const m = extractMonthFromThaiDate(row[1]);
            let q = "Q1";
            if ([10, 11, 12].includes(m)) q = "Q1";
            else if ([1, 2, 3].includes(m)) q = "Q2";
            else if ([4, 5, 6].includes(m)) q = "Q3";
            else if ([7, 8, 9].includes(m)) q = "Q4";

            qBreakdown[q].count++;
            qBreakdown[q].people += people;
            qBreakdown[q].orgs += orgs;
            qBreakdown[q].income += income;
            qBreakdown[q].social += social;
        });

        const totalContract = AppState.rawProcurementData.reduce((acc, item) => acc + parseCleanNumber(item.contractAmount || item.contractAmountK), 0);
        const paidProcCount = AppState.rawProcurementData.filter(item => item.status && (item.status.includes("เบิกจ่าย") || item.status.includes("จบงาน"))).length;
        const paidRate = AppState.rawProcurementData.length > 0 ? Math.round((paidProcCount / AppState.rawProcurementData.length) * 100) : 0;

        const elEco = document.getElementById("insight-economic-impact");
        const elContract = document.getElementById("insight-contract-total");
        const elProcRate = document.getElementById("insight-proc-rate");
        if (elEco) elEco.innerText = "฿" + (totalRevenue + totalSocial).toLocaleString('th-TH');
        if (elContract) elContract.innerText = "฿" + totalContract.toLocaleString('th-TH');
        if (elProcRate) elProcRate.innerText = paidRate + "%";

        // Render Quarterly Table
        const qTbody = document.getElementById("quarterlyTableBody");
        if (qTbody) {
            const qLabels = {
                Q1: "ไตรมาส 1 (ต.ค. - ธ.ค.)",
                Q2: "ไตรมาส 2 (ม.ค. - มี.ค.)",
                Q3: "ไตรมาส 3 (เม.ย. - มิ.ย.)",
                Q4: "ไตรมาส 4 (ก.ค. - ก.ย.)"
            };
            let qHtml = "";
            Object.keys(qBreakdown).forEach(q => {
                const item = qBreakdown[q];
                qHtml += `
                <tr>
                    <td class="font-bold text-slate-800 dark:text-slate-200">${qLabels[q]}</td>
                    <td class="text-right font-num">${item.count} รายการ</td>
                    <td class="text-right font-num font-semibold text-blue-600 dark:text-blue-400">${item.people.toLocaleString('th-TH')}</td>

    function submitDataEntryForm(event) {
        event.preventDefault();
        const btn = document.getElementById("saveDataBtn");
        btn.disabled = true;
        btn.innerText = "กำลังบันทึก...";

        const recordId = document.getElementById("frmRecordId").value;
        const startDate = document.getElementById("frmStartDate").value;
        const endDate = document.getElementById("frmEndDate").value;

        function formatThai(dStr) {
            if (!dStr) return "";
            const p = dStr.split('-');
            return `${parseInt(p[2])}/${parseInt(p[1])}/${parseInt(p[0]) + 543}`;
        }

        const dateThai = startDate === endDate ? formatThai(startDate) : `${formatThai(startDate)} - ${formatThai(endDate)}`;

        const formData = {
            date: dateThai,
            dept: document.getElementById("frmDept").value,
            title: document.getElementById("frmTitle").value,
            projectCode: document.getElementById("frmProjectCode").value,
            people: document.getElementById("frmPeople").value,
            orgs: document.getElementById("frmOrgs").value,
            income: document.getElementById("frmIncome").value,
            social: document.getElementById("frmSocial").value,
            category: document.getElementById("frmCategory").value,
            responsible: document.getElementById("frmResponsible").value,
            kpi: document.getElementById("frmKpi").value,
            note: document.getElementById("frmNote").value,
            privPeople: document.getElementById("frmPrivPeople").value,
            privValue: document.getElementById("frmPrivValue").value
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            const runner = recordId ? google.script.run.updateActivityRecord(recordId, formData) : google.script.run.addRecord(formData);
            
            google.script.run
                .withSuccessHandler(function (res) {
                    btn.disabled = false;
                    btn.innerText = "บันทึกข้อมูล";
                    if (res && res.status === "success") {
                        closeDataEntryModal();
                        showToast("บันทึกสำเร็จ", "ข้อมูลถูกอัปเดตลง Google Sheets เรียบร้อยแล้ว", "success");
                        setTimeout(() => fetchLiveServerData(true), 800);
                    } else {
                        showToast("เกิดข้อผิดพลาด", res ? res.message : "ไม่สามารถบันทึกได้", "error");
                    }
                })
                .withFailureHandler(function (err) {
                    btn.disabled = false;
                    btn.innerText = "บันทึกข้อมูล";
                    showToast("ข้อผิดพลาด", err.message, "error");
                })
                .addRecord(formData);
        } else {
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "บันทึกข้อมูล";
                closeDataEntryModal();

    /**
     * ══════════════════════════════════════════════════════════════════
     * 🔔 15. TOAST NOTIFICATION UTILITY
     * ══════════════════════════════════════════════════════════════════
     */
    function showToast(header, message, type = "success") {
        const toast = document.getElementById("toastNotification");
        const toastHead = document.getElementById("toastHeader");
        const toastMsg = document.getElementById("toastMessage");
        const toastBg = document.getElementById("toastIconBg");
        if (!toast) return;

        toastHead.innerText = header;
        toastMsg.innerText = message;

        if (type === "success") toastBg.className = "w-8 h-8 rounded-lg bg-emerald-500 text-white flex items-center justify-center shrink-0";
        else if (type === "warning") toastBg.className = "w-8 h-8 rounded-lg bg-amber-500 text-white flex items-center justify-center shrink-0";
        else if (type === "error") toastBg.className = "w-8 h-8 rounded-lg bg-rose-500 text-white flex items-center justify-center shrink-0";
        else toastBg.className = "w-8 h-8 rounded-lg bg-blue-500 text-white flex items-center justify-center shrink-0";

        toast.classList.remove("opacity-0", "translate-y-[-140%]");
        toast.classList.add("opacity-100", "translate-y-0");

        setTimeout(() => {
            toast.classList.remove("opacity-100", "translate-y-0");
            toast.classList.add("opacity-0", "translate-y-[-140%]");
        }, 3200);
    }
